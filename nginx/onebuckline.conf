# HTTP: only ACME challenges and a redirect to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://onebuckline.com$request_uri;
    }
}

# Reject TLS for any hostname other than onebuckline.com.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onebuckline.com;

    ssl_certificate     /etc/letsencrypt/live/onebuckline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onebuckline.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://buckline:3000;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location /api/events {
        proxy_pass http://buckline:3000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

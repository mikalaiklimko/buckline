name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: rpod
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      - name: Resolve deploy path
        run: |
          # Expand a leading "~" to the remote home directory.
          case "$DEPLOY_PATH" in
            "~"|"~/"*) DEPLOY_PATH="$(ssh target 'echo $HOME')${DEPLOY_PATH#\~}" ;;
          esac
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
          echo "Deploying to $DEPLOY_PATH"
          ssh target "mkdir -p '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'" \
            || { echo "Missing $DEPLOY_PATH/.env on server" >&2; exit 1; }

      # The image is built here, not on the server: the instance is too small
      # (512 MB RAM, burstable CPU) to run docker build reliably.
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: buckline:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image
        run: |
          # Rotate: the running "latest" becomes "previous" (kept for rollback).
          ssh target 'docker image inspect buckline:latest >/dev/null 2>&1 && docker tag buckline:latest buckline:previous || true'
          docker save buckline:latest | gzip -1 | ssh target 'gunzip | docker load'

      - name: Upload config files
        run: |
          rsync -az --relative docker-compose.yml nginx/ scripts/ "target:$DEPLOY_PATH/"

      - name: Restart service
        run: |
          ssh target "cd '$DEPLOY_PATH' && docker compose up -d --no-build --remove-orphans"

      - name: Health check
        id: health
        run: |
          for i in $(seq 1 20); do
            if ssh target "wget -qO- http://127.0.0.1:3000/healthz" >/dev/null 2>&1; then
              echo "Healthy"; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; ssh target "cd '$DEPLOY_PATH' && docker compose logs --tail=100 buckline"; exit 1

      - name: Roll back to previous image
        if: failure() && steps.health.conclusion == 'failure'
        run: ssh target "cd '$DEPLOY_PATH' && sh scripts/rollback.sh"

      - name: Prune old images
        if: success()
        run: |
          # Keep only buckline:latest and buckline:previous. Older builds lost
          # their tags during rotation and are now dangling, so prune removes them.
          ssh target 'docker image prune -f >/dev/null && docker images buckline --format "{{.Repository}}:{{.Tag}}  {{.ID}}  {{.CreatedSince}}"'

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy

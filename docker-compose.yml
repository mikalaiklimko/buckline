services:
  buckline:
    build: .
    image: buckline:latest
    # Only reachable from the host (deploy health check) and from nginx.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - buckline-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - buckline
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/onebuckline.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates are picked up.
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

volumes:
  buckline-data:
  letsencrypt:
    name: buckline_letsencrypt
  certbot-www:
    name: buckline_certbot_www
